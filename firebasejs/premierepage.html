      <button class="button-menu">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="2em"
          height="2em"
          aria-hidden="true"
          viewBox="0 0 24 24"
          stroke-width="2"
          fill="none"
          stroke="currentColor"
          class="icon-search"
        >
          <path
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            stroke-linejoin="round"
            stroke-linecap="round"
          ></path>
        </svg>
      </button>
      <div class="search-container"></div>
      <button class="button-menu">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="2em"
          height="2em"
          viewBox="0 0 24 24"
          stroke-width="0"
          fill="currentColor"
          stroke="currentColor"
          class="icon-person"
        >

            d="M12 2.5a5.5 5.5 0 0 1 3.096 10.047 9.005 9.005 0 0 1 5.9 8.181.75.75 0 1 1-1.499.044 7.5 7.5 0 0 0-14.993 0 .75.75 0 0 1-1.5-.045 9.005 9.005 0 0 1 5.9-8.18A5.5 5.5 0 0 1 12 2.5ZM8 8a4 4 0 1 0 8 0 4 4 0 0 0-8 0Z"
          ></path>
        </svg>
      </button>
    </div>

    <main>
      <div id="container">
        <div id="left">
          <div id="calendar">
            <div id="month">
              <em class="fa fa-angle-left prev"></em>
              <div class="date"></div>
              <em class="fa fa-angle-right next"></em>
            </div>
            <div id="weekdays">
              <div>Monday</div>
              <div>Tuesday</div>
              <div>Wednesday</div>
              <div>Thursday</div>
              <div>Friday</div>
              <div>Saturday</div>
              <div>Sunday</div>
            </div>
            <div id="days">

            <!-- recherche -->
            <div id="goto_today">
              <div id="goto">
                <input type="text" placeholder="mm/yyyy" id="input_goto" />
                <button id="button_togo">Go</button>
              </div>
              <div id="gototoday">
                <button id="button_today">today</button>
              </div>
            </div>
          </div>
        </div>
        <div id="right">
          <div id="today_date">
            <div id="event_day"></div>
            <div id="event_date"></div>
          </div>
          <div id="events">
            <!-- <div class="event">
              <div class="title">
                <div class="event_title">Title</div>
              </div>
              <div class="event_time">Horaire</div>
            </div> -->
          </div>
          <div class="start_container">
            <div class="start_container_adjustement">
              <div class="Event_name_container">
                <div class="Event_name">Event name</div>
                <i class="fas fa-times close"></i>
              </div>
              <div class="container_time">
                <div class="Start_time">
                  <h4>Start Time</h4>
                  <div class="start_time">13h19</div>
                </div>
                <div class="End_time">
                  <h4>End Time</h4>
                  <div class="end_time">13h21</div>
                </div>
              </div>
              <button class="button_start_meeting">
                <span class="button_lg">
                  <span class="button_sl"></span>
                  <span class="button_text">Start the meeting</span>
                </span>
              </button>
            </div>
          </div>
          <div id="add-event-wrapper">
            <div id="add-event-header">
              <div class="title">Add event</div>
              <i class="fas fa-times close"></i>
            </div>
            <div id="add-event-body">
              <div class="add-event-input">
                <input
                  placeholder="Event Name"
                  class="event-name"
                  name="Event Name"
                  type="text"
                />
              </div>
              <div class="add-event-input">
                <input
                  type="text"
                  placeholder="Event Time From"
                  class="event-time-from"
                />
              </div>
              <div class="add-event-input">
                <input
                  type="text"
                  placeholder="Event Time To"
                  class="event-time-to"
                />
              </div>
            </div>
            <div class="add-event-footer">
              <button class="add-event-byn">Add event</button>
            </div>
          </div>
          <button class="add-event-plus">
            <i class="fas fa-plus"></i>
          </button>
